<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>OFFGRID - Page not found</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#090b0d;--panel:#111518;--text:#f0f5ef;--muted:#a0aaa4;--line:rgba(220,255,235,.12);--lime:#c8ff5f;--mint:#7ef0c0}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px;overflow:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(ellipse at 82% 10%,rgba(126,240,192,.10),transparent 36%),radial-gradient(ellipse at 8% 45%,rgba(200,255,95,.06),transparent 35%)}
a{color:inherit;text-decoration:none}
.card{position:relative;width:min(520px,100%);text-align:center;border:1px solid rgba(200,255,95,.24);border-radius:20px;padding:48px 34px 40px;background:radial-gradient(ellipse at 90% 0%,rgba(200,255,95,.12),transparent 45%),linear-gradient(145deg,#141d17,#0d1110);box-shadow:0 30px 80px rgba(0,0,0,.55);overflow:hidden}
.card:after{content:"404";position:absolute;right:-10px;bottom:-34px;font-size:150px;font-weight:800;letter-spacing:-.08em;color:rgba(255,255,255,.03);pointer-events:none}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.16em;font-size:14px;margin-bottom:28px}
.brand img{width:28px;height:28px;display:block}
.mono{font-family:'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase}
.kicker{font-size:10px;color:var(--lime);margin-bottom:14px}
h1{margin:0 0 12px;font-size:clamp(30px,6vw,40px);letter-spacing:-.03em;line-height:1.1}
h1 span{background:linear-gradient(90deg,var(--lime),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0 auto 28px;max-width:380px;color:var(--muted);font-size:14px;line-height:1.7;position:relative;z-index:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--lime);background:var(--lime);color:#11170d;padding:16px 26px;border-radius:9px;font:800 14px Manrope,system-ui,sans-serif;cursor:pointer;position:relative;z-index:1;transition:transform .25s,box-shadow .25s,background .25s}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 34px rgba(200,255,95,.18);background:#d7ff8b}
.btn:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.fine{margin-top:18px;font-size:10px;color:#66726a;position:relative;z-index:1}
@media(prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<main class="card">
  <a class="brand" href="/"><img src="/logo.svg" alt="" aria-hidden="true"><span>OFFGRID</span></a>
  <div class="kicker mono">Error 404</div>
  <h1>Looks like this page<br><span>went off the grid.</span></h1>
  <p>The page you were looking for doesn't exist, or it was moved. If you were trying to grab OFFGRID, the download is right where you left it.</p>
  <a class="btn" href="/#download">Back to the download page <span aria-hidden="true">&rarr;</span></a>
  <div class="fine mono">offgrid.wtfq.online</div>
</main>
</body>
</html>
