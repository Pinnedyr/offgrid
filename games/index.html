<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Games</title>
<link rel="icon" type="image/png" href="games-icon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--bg:#0d0a08;--panel:#17120e;--text:#f7f1ea;--muted:#b0a69c;--line:rgba(255,235,220,.12);--lime:#ff9f2e;--mint:#ffc766;--green:#e8650a}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;overflow-x:hidden;transition:opacity .28s ease,transform .28s ease}
body.leaving{opacity:0;transform:scale(1.02)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px}

/* background */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(80px);will-change:transform}
.b1{width:520px;height:520px;left:-140px;top:-120px;background:rgba(255,183,77,.15);animation:d1 20s ease-in-out infinite}
.b2{width:620px;height:620px;right:-180px;top:60px;background:rgba(232,101,10,.24);animation:d2 24s ease-in-out infinite}
.b3{width:460px;height:460px;left:32%;bottom:-220px;background:rgba(232,101,10,.18);animation:d1 28s ease-in-out infinite reverse}
.grid{position:absolute;inset:0;opacity:.4;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 5%,transparent 65%);mask-image:radial-gradient(ellipse at 50% 20%,#000 5%,transparent 65%)}
.spark{position:absolute;bottom:-12px;left:var(--x);width:3px;height:3px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime);opacity:0;animation:rise var(--d) linear infinite;animation-delay:var(--w)}
@keyframes d1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(70px,50px) scale(1.12)}}
@keyframes d2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-80px,40px) scale(.92)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.8}85%{opacity:.5}100%{transform:translateY(-100vh);opacity:0}}

.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;flex:0 0 auto}

/* hero */
main{max-width:1200px;margin:0 auto;padding:clamp(36px,8vh,84px) 24px 80px}
.pill{display:inline-flex;align-items:center;gap:12px;padding:8px 16px 8px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(26,19,14,.62);backdrop-filter:blur(12px);font-size:13px;font-weight:600;color:#ffe6cc}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--lime);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,159,46,.55)}70%{box-shadow:0 0 0 9px rgba(255,159,46,0)}100%{box-shadow:0 0 0 0 rgba(255,159,46,0)}}
h1{margin:22px 0 0;font-size:clamp(42px,7vw,92px);line-height:1;letter-spacing:-.055em;font-weight:800}
h1 .grad{display:inline-block;padding-bottom:.16em;margin-bottom:-.16em;background:linear-gradient(100deg,var(--green),var(--lime),var(--green));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.sub{max-width:520px;margin:18px 0 0;color:var(--muted);font-size:17px;line-height:1.7}
.rv{animation:up .85s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*90ms + 60ms)}
@keyframes up{from{opacity:0;transform:translateY(24px)}}

/* search + filters */
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes ring{to{--ang:360deg}}
.search{position:relative;display:flex;align-items:center;gap:10px;width:min(620px,100%);margin-top:30px;padding:7px 7px 7px 20px;border:1px solid var(--line);border-radius:999px;background:rgba(22,16,12,.8);backdrop-filter:blur(16px);box-shadow:0 24px 70px rgba(0,0,0,.35);transition:border-color .3s,box-shadow .3s,transform .3s}
.search:before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:conic-gradient(from var(--ang),transparent 0 55%,#e8650a 72%,#ffb866 92%,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);opacity:0;transition:opacity .4s;pointer-events:none}
.search:focus-within{border-color:transparent;transform:translateY(-2px);box-shadow:0 28px 80px rgba(0,0,0,.45),0 0 60px rgba(255,183,77,.12)}
.search:focus-within:before{opacity:1;animation:ring 3.5s linear infinite}
.search .ic{width:20px;height:20px;color:#8f8174;transition:color .3s}
.search:focus-within .ic{color:#ffb866}
.search input{flex:1;min-width:0;height:46px;border:0;background:transparent;color:var(--text);font:500 16px Manrope,system-ui,sans-serif;outline:none}
.search input::placeholder{color:#8a7c6f}
.search kbd{font:11px 'DM Mono',monospace;color:#8f8174;border:1px solid var(--line);border-radius:7px;padding:5px 9px;margin-right:6px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;min-height:38px}
.chip{border:1px solid var(--line);background:rgba(26,19,14,.7);color:#ffe6cc;border-radius:999px;padding:9px 16px;font:12px 'DM Mono',monospace;letter-spacing:.04em;cursor:pointer;transition:border-color .25s,color .25s,background .25s,transform .25s}
.chip:hover{border-color:var(--lime);color:var(--lime);transform:translateY(-3px)}
.chip.on{background:var(--lime);border-color:var(--lime);color:#1a0f05;font-weight:500}

/* game cards */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;margin-top:40px}
.card{--mx:50%;--my:50%;position:relative;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;background:rgba(24,19,14,.78);overflow:hidden;isolation:isolate;animation:pop .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--n,0)*55ms);transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .35s}
@keyframes pop{from{opacity:0;transform:translateY(28px) scale(.96)}}
.card:before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(260px circle at var(--mx) var(--my),rgba(255,159,46,.14),transparent 70%)}
.card:hover{transform:translateY(-8px);border-color:rgba(255,159,46,.5);box-shadow:0 26px 60px rgba(0,0,0,.5),0 0 40px rgba(255,183,77,.08)}
.card:hover:before{opacity:1}
.card:active{transform:translateY(-3px) scale(.985)}
.thumb{position:relative;aspect-ratio:16/10;overflow:hidden;background:#16100c}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.card:hover .thumb img,.card:hover .tile{transform:scale(1.08)}
.tile{width:100%;height:100%;display:grid;place-items:center;font-size:64px;font-weight:800;letter-spacing:-.05em;color:rgba(255,255,255,.9);background:linear-gradient(135deg,hsl(var(--h) 60% 22%),hsl(calc(var(--h) + 18) 70% 11%));transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.thumb:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(24,19,14,.9))}
.play{position:absolute;right:14px;bottom:14px;z-index:3;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:var(--lime);color:#1a0f05;opacity:0;transform:translateY(10px) scale(.8);transition:opacity .3s,transform .4s cubic-bezier(.2,.8,.2,1)}
.play .ic{width:18px;height:18px;fill:currentColor;stroke:none;margin-left:2px}
.card:hover .play,.card:focus-visible .play{opacity:1;transform:none}
.info{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.info h2{margin:0;font-size:19px;letter-spacing:-.02em;font-weight:700}
.info p{margin:0;color:var(--muted);font-size:14px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ctags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.ctags span{font:11px 'DM Mono',monospace;color:#ffcf99;border:1px solid var(--line);border-radius:999px;padding:3px 10px}

/* states */
.state{grid-column:1/-1;text-align:center;padding:70px 20px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);line-height:1.7}
.state b{display:block;color:var(--text);font-size:20px;margin-bottom:6px}
.state code{font:13px 'DM Mono',monospace;color:var(--lime)}
.skel{aspect-ratio:16/13;border-radius:18px;border:1px solid var(--line);background:linear-gradient(100deg,rgba(24,19,14,.8) 30%,rgba(60,45,34,.6) 50%,rgba(24,19,14,.8) 70%);background-size:300% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-300% 0}}
footer{border-top:1px solid var(--line);color:#7d6f62;font:12px 'DM Mono',monospace;text-align:center;padding:24px}

@media (max-width:560px){main{padding-left:16px;padding-right:16px}.list{grid-template-columns:1fr 1fr;gap:12px}.info{padding:12px 12px 16px}.info h2{font-size:16px}.info p{display:none}.search kbd{display:none}.play{display:none}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="grid"></div><div id="sparks"></div></div>

<main>
  <div class="pill rv" style="--i:0"><span class="dot"></span><span id="count">Loading games</span></div>
  <h1 class="rv" style="--i:1">Pick a game.<br><span class="grad">Play it now.</span></h1>
  <p class="sub rv" style="--i:2">Click any game to jump straight in. No downloads, no sign-ups.</p>
  <label class="search rv" style="--i:3">
    <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search games" autocomplete="off" spellcheck="false" aria-label="Search games">
    <kbd>/</kbd>
  </label>
  <div class="tags rv" style="--i:4" id="tags"></div>
  <section class="list" id="list" aria-live="polite">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </section>
</main>
<footer>offgrid.wtfq.online/games</footer>

<script>
(function(){
  var list=document.getElementById('list'),tagsEl=document.getElementById('tags'),q=document.getElementById('q'),count=document.getElementById('count');
  var games=[],active='All';

  /* floating sparks */
  var sp=document.getElementById('sparks'),i;
  for(i=0;i<14;i++){var s=document.createElement('i');s.className='spark';s.style.setProperty('--x',(Math.random()*100)+'%');s.style.setProperty('--d',(10+Math.random()*12)+'s');s.style.setProperty('--w',(-Math.random()*20)+'s');sp.appendChild(s);}

  function esc(t){var d=document.createElement('div');d.textContent=t==null?'':String(t);return d.innerHTML;}
  function hue(str){var h=0,k;for(k=0;k<str.length;k++)h=(h*31+str.charCodeAt(k))%360;return 8+h%32;}

  function card(g,n){
    var a=document.createElement('a');
    a.className='card';a.href=g.url||'#';a.style.setProperty('--n',Math.min(n,14));
    if(g.newTab){a.target='_blank';a.rel='noopener';}
    var title=g.title||'Untitled';
    var thumb=g.image
      ?'<img src="'+esc(g.image)+'" alt="" loading="lazy" draggable="false">'
      :'<div class="tile" style="--h:'+hue(title)+'">'+esc(title.charAt(0).toUpperCase())+'</div>';
    var tg=(g.tags||[]).map(function(t){return '<span>'+esc(t)+'</span>';}).join('');
    a.innerHTML='<div class="thumb">'+thumb+'<span class="play"><svg class="ic" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg></span></div>'
      +'<div class="info"><h2>'+esc(title)+'</h2>'+(g.description?'<p>'+esc(g.description)+'</p>':'')+(tg?'<div class="ctags">'+tg+'</div>':'')+'</div>';
    var img=a.querySelector('img');
    if(img)img.addEventListener('error',function(){var t=document.createElement('div');t.className='tile';t.style.setProperty('--h',hue(title));t.textContent=title.charAt(0).toUpperCase();img.replaceWith(t);});
    a.addEventListener('pointermove',function(e){var r=a.getBoundingClientRect();a.style.setProperty('--mx',(e.clientX-r.left)+'px');a.style.setProperty('--my',(e.clientY-r.top)+'px');});
    a.addEventListener('click',function(e){
      if(g.newTab||e.ctrlKey||e.metaKey||e.shiftKey||e.button!==0)return;
      e.preventDefault();document.body.classList.add('leaving');
      setTimeout(function(){location.href=a.href;},280);
    });
    return a;
  }

  function render(){
    var term=q.value.trim().toLowerCase();
    var out=games.filter(function(g){
      if(active!=='All'&&(g.tags||[]).indexOf(active)<0)return false;
      if(!term)return true;
      return (g.title+' '+(g.description||'')+' '+(g.tags||[]).join(' ')).toLowerCase().indexOf(term)>=0;
    });
    list.textContent='';
    if(!out.length){
      list.innerHTML='<div class="state"><b>No games found</b>Try a different search or pick another category.</div>';
      return;
    }
    out.forEach(function(g,n){list.appendChild(card(g,n));});
  }

  function renderTags(){
    var set={},all=['All'];
    games.forEach(function(g){(g.tags||[]).forEach(function(t){if(!set[t]){set[t]=1;all.push(t);}});});
    tagsEl.textContent='';
    if(all.length<2)return;
    all.forEach(function(t){
      var b=document.createElement('button');b.type='button';b.className='chip'+(t===active?' on':'');b.textContent=t;
      b.addEventListener('click',function(){active=t;renderTags();render();});
      tagsEl.appendChild(b);
    });
  }

  q.addEventListener('input',render);
  document.addEventListener('keydown',function(e){
    if(e.key!=='/'||e.ctrlKey||e.metaKey||e.altKey||document.activeElement===q)return;
    e.preventDefault();q.focus();
  });

  fetch('games.json',{cache:'no-cache'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(data){
      games=Array.isArray(data)?data:(data.games||[]);
      count.textContent=games.length+(games.length===1?' game':' games');
      renderTags();render();
    })
    .catch(function(err){
      count.textContent='Could not load games';
      list.innerHTML='<div class="state"><b>games.json did not load</b>Make sure <code>games.json</code> sits next to this file and is valid JSON.<br>('+esc(err.message)+')</div>';
    });
})();
</script>
</body>
</html>
