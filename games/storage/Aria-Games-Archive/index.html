<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aria Games</title>
<link rel="icon" href="storage/images/logo.png"> 

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root {
  --bg:#070a10;
  --border:#1a2035;
  --text:#c8d4e8;
  --accent:#3a7bff;
}

body {
  background:var(--bg);
  font-family:'Sora', sans-serif;
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}

/* TOP BAR */
#bar {
  height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  border-bottom:2px solid var(--border);
  background:linear-gradient(135deg, rgba(7,10,16,0.95), rgba(20,25,45,0.8));
  position:relative;
  overflow:hidden;
  z-index:10;
  gap:30px;
}

/* Animated background glow */
#bar::before {
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  bottom:0;
  background:radial-gradient(circle at 50% 0%, rgba(58,123,255,0.1), transparent 70%);
  pointer-events:none;
}

#title {
  font-family:'Orbitron', monospace;
  font-size:48px;
  letter-spacing:0.4em;
  font-weight:900;
  color:white;
  text-shadow:
    0 0 10px rgba(58,123,255,0.8),
    0 0 20px rgba(58,123,255,0.5),
    0 0 30px rgba(58,123,255,0.3),
    2px 2px 4px rgba(0,0,0,0.8);
  position:relative;
  z-index:2;
  animation:titleGlow 2.5s ease-in-out infinite, titleShift 4s ease-in-out infinite;
  transform:perspective(1000px) rotateX(0deg);
  cursor:pointer;
  transition:0.1s ease;
}

#title:hover {
  animation:glitchEffect 0.3s ease-in-out;
}

@keyframes glitchEffect {
  0%, 100% {
    text-shadow:
      0 0 10px rgba(58,123,255,0.8),
      0 0 20px rgba(58,123,255,0.5),
      0 0 30px rgba(58,123,255,0.3),
      2px 2px 4px rgba(0,0,0,0.8);
    transform:translateX(0);
  }
  25% {
    text-shadow:
      -2px 0 rgba(255,0,100,0.8),
      2px 0 rgba(0,255,150,0.8),
      0 0 30px rgba(58,123,255,0.3);
    transform:translateX(-2px);
  }
  50% {
    text-shadow:
      0 0 20px rgba(58,123,255,1),
      0 0 40px rgba(58,123,255,0.8),
      0 0 60px rgba(58,123,255,0.5),
      2px 2px 8px rgba(58,123,255,0.4),
      2px 2px 4px rgba(0,0,0,0.8);
    transform:translateX(2px);
  }
  75% {
    text-shadow:
      -2px 0 rgba(0,255,150,0.8),
      2px 0 rgba(255,0,100,0.8),
      0 0 30px rgba(58,123,255,0.3);
    transform:translateX(-1px);
  }
}

@keyframes titleGlow {
  0%, 100% {
    text-shadow:
      0 0 10px rgba(58,123,255,0.8),
      0 0 20px rgba(58,123,255,0.5),
      0 0 30px rgba(58,123,255,0.3),
      2px 2px 4px rgba(0,0,0,0.8);
  }
  50% {
    text-shadow:
      0 0 20px rgba(58,123,255,1),
      0 0 40px rgba(58,123,255,0.8),
      0 0 60px rgba(58,123,255,0.5),
      2px 2px 8px rgba(58,123,255,0.4),
      2px 2px 4px rgba(0,0,0,0.8);
  }
}

@keyframes titleShift {
  0%, 100% { letter-spacing:0.4em; }
  50% { letter-spacing:0.5em; }
}

/* Holographic effect line under title */
#title::after {
  content:"";
  position:absolute;
  bottom:-10px;
  left:50%;
  transform:translateX(-50%);
  width:80%;
  height:3px;
  background:linear-gradient(90deg, transparent, rgba(58,123,255,0.8), transparent);
  animation:scanLine 2s ease-in-out infinite;
}

@keyframes scanLine {
  0%, 100% {
    box-shadow:0 0 10px rgba(58,123,255,0.5);
    opacity:0.6;
  }
  50% {
    box-shadow:0 0 20px rgba(58,123,255,0.9);
    opacity:1;
  }
}

/* MENU WRAP */
#menu {
  flex:1;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-content:flex-start;
  gap:22px;
  padding:40px;
  position:relative;
  z-index:5;
}

/* CARD */
.card {
  width:240px;
  height:180px;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  border:1px solid var(--border);
  background:#0b0f18;
  transition:0.2s ease;
  position:relative;
  animation:cardEntrance 0.6s ease-out forwards;
  opacity:0;
}

@keyframes cardEntrance {
  0% {
    opacity:0;
    transform:translateY(30px) scale(0.95);
  }
  100% {
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.card:nth-child(1) { animation-delay:0.1s; }
.card:nth-child(2) { animation-delay:0.2s; }
.card:nth-child(3) { animation-delay:0.3s; }
.card:nth-child(4) { animation-delay:0.4s; }
.card:nth-child(n+5) { animation-delay:0.5s; }

.card:hover {
  transform:translateY(-8px);
  box-shadow:0 0 25px rgba(58,123,255,0.25);
  border-color:rgba(58,123,255,0.4);
}

.card::before {
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
  transition:0.5s ease;
  z-index:2;
  pointer-events:none;
}

.card:hover::before {
  left:100%;
}

/* IMAGE */
.card img {
  width:240px;
  height:140px;
  object-fit:cover;
  display:block;
  transition:0.3s ease;
  filter:brightness(1);
}

.card:hover img {
  filter:brightness(1.1);
}

/* LABEL */
.card-label {
  height:40px;
  display:flex;
  align-items:center;
  padding:0 12px;
  font-size:13px;
  font-weight:500;
  color:#c8d4e8;
  background:linear-gradient(to top, rgba(0,0,0,0.7), rgba(0,0,0,0.3));
  border-top:1px solid var(--border);
}

/* subtle glow line */
.card::after {
  content:"";
  display:block;
  height:2px;
  width:100%;
  background:linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity:0.3;
  transition:0.2s ease;
}

.card:hover::after {
  opacity:1;
  box-shadow:0 0 8px rgba(58,123,255,0.6);
}

/* BACK BUTTON */
#back-btn {
  position:fixed;
  top:20px;
  left:20px;
  padding:10px 16px;
  background:rgba(58,123,255,0.2);
  border:1px solid rgba(58,123,255,0.4);
  color:var(--text);
  border-radius:6px;
  cursor:pointer;
  font-size:14px;
  font-weight:500;
  transition:0.2s ease;
  z-index:100;
  overflow:hidden;
}

#back-btn:hover {
  background:rgba(58,123,255,0.4);
  border-color:rgba(58,123,255,0.8);
  box-shadow:0 0 15px rgba(58,123,255,0.4);
}

/* PAGE TRANSITION */
.page-exit {
  animation:fadeOut 0.4s ease-out forwards;
}

@keyframes fadeOut {
  0% {
    opacity:1;
    transform:scale(1);
  }
  100% {
    opacity:0;
    transform:scale(0.98);
  }
}

@keyframes fadeIn {
  0% {
    opacity:0;
    transform:scale(0.98);
  }
  100% {
    opacity:1;
    transform:scale(1);
  }
}

body {
  animation:fadeIn 0.6s ease-out;
}
</style>
</head>

<body>

<div id="bar">
  <button id="back-btn">← Back</button>
  <div id="title">ARIA GAMES</div>
</div>

<div id="menu"></div>

<script>
/* =========================
   GAMES MENU SYSTEM
   ========================= */
const GAMES = [
  {
    name: "Cosmic Assault",
    image: "storage/images/cosmic assault.png",
    link: "storage/cosmic assault.html"
  },

  {
    name: "Nova Siege",
    image: "storage/images/nova siege.png",
    link: "storage/nova-siege.html"
  },

  {
    name: "Neon Drift",
    image: "storage/images/neon drift.png",
    link: "storage/neon drift.html"
  },

   {
    name: "Arcade Games",
    image: "storage/images/arcade.png",
    link: "storage/arcade.html"
  },

   {
    name: "Solitaire",
    image: "storage/images/solitaire.png",
    link: "storage/solitaire.html"
  },

    {
    name: "Apex Runner",
    image: "storage/images/apex.png",
    link: "storage/apex.html"
  },

   {
    name: "Velvet Casino",
    image: "storage/images/velvet.png",
    link: "storage/velvet.html"
  },
   
   {
    name: "Aria Clicker",
    image: "storage/images/clicker.png",
    link: "storage/clicker.html"
  },

  {
    name: "Angry Birds",
    image: "storage/images/angry.png",
    link: "storage/angrybirds.html"
  },

   {
    name: "Chess",
    image: "storage/images/chess.png",
    link: "storage/chess.html"
  },

     {
    name: "Stacktris",
    image: "storage/images/stacktris.png",
    link: "storage/stacktris.html"
  },

   {
    name: "Flappy Bird",
    image: "storage/images/flap.png",
    link: "storage/flappybird.html"
  },

     {
    name: "Moto X3M",
    image: "storage/images/moto.png",
    link: "storage/motox3m3.html"
  },
];

const menu = document.getElementById("menu");

GAMES.forEach(game => {
  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <img src="${game.image}" alt="${game.name}">
    <div class="card-label">${game.name}</div>
  `;

  card.onclick = () => {
    window.open(game.link, "_blank");
  };

  menu.appendChild(card);
});

/* =========================
   BACK BUTTON
   ========================= */
document.getElementById("back-btn").addEventListener("click", () => {
  window.location.href = "../../index.html";
});

/* =========================
   ALT KEY SWITCH (INSTANT)
   ========================= */
document.addEventListener("keydown", (e) => {
  if (e.key === "Alt") {
    window.open("../Startside-Classroom.html", "_blank");
  }
});
</script>
<script src="../udir.js"></script>
</body>
</html>
